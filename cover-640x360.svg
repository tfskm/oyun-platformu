<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12203f"/>
      <stop offset="60%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#3ee0ff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#2a6cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#05070f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e39b28"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="tiny" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <g id="gemRuby">
      <polygon points="0,-26 24,0 0,26 -24,0" fill="#ff4d6d" stroke="#ffb3c1" stroke-width="2"/>
      <polygon points="0,-13 12,0 0,13 -12,0" fill="#ffb3c1" opacity="0.55"/>
    </g>
    <g id="gemAmber">
      <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="#ffb020" stroke="#ffe3a3" stroke-width="2"/>
      <polygon points="-10,-10 6,-14 10,4 -6,8" fill="#ffe3a3" opacity="0.5"/>
    </g>
    <g id="gemEmerald">
      <polygon points="0,-28 8,-9 27,-9 12,3 18,22 0,11 -18,22 -12,3 -27,-9 -8,-9" fill="#2ee6a8" stroke="#a9ffe4" stroke-width="2"/>
      <circle cx="-5" cy="-7" r="4" fill="#a9ffe4" opacity="0.6"/>
    </g>
    <g id="gemSapphire">
      <rect x="-22" y="-22" width="44" height="44" rx="9" fill="#4d9dff" stroke="#bcd8ff" stroke-width="2"/>
      <rect x="-14" y="-14" width="20" height="14" rx="5" fill="#bcd8ff" opacity="0.5"/>
    </g>
    <g id="gemAmethyst">
      <polygon points="0,-26 25,19 -25,19" fill="#b46bff" stroke="#e0c4ff" stroke-width="2"/>
      <polygon points="0,-12 12,11 -12,11" fill="#e0c4ff" opacity="0.45"/>
    </g>
    <g id="gemPearl">
      <circle cx="0" cy="0" r="25" fill="#eaf6ff" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-8" cy="-9" r="7" fill="#ffffff" opacity="0.85"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- yıldızlar -->
  <g fill="#bcd8ff">
    <circle cx="38" cy="46" r="1.4" opacity="0.7"/><circle cx="92" cy="104" r="1" opacity="0.5"/>
    <circle cx="151" cy="38" r="1.7" opacity="0.8"/><circle cx="214" cy="82" r="1" opacity="0.45"/>
    <circle cx="286" cy="32" r="1.2" opacity="0.6"/><circle cx="352" cy="78" r="1.6" opacity="0.7"/>
    <circle cx="418" cy="30" r="1" opacity="0.5"/><circle cx="486" cy="72" r="1.5" opacity="0.75"/>
    <circle cx="556" cy="40" r="1.1" opacity="0.6"/><circle cx="608" cy="98" r="1.6" opacity="0.7"/>
    <circle cx="60" cy="286" r="1.3" opacity="0.55"/><circle cx="128" cy="322" r="1" opacity="0.5"/>
    <circle cx="230" cy="300" r="1.5" opacity="0.6"/><circle cx="330" cy="334" r="1" opacity="0.45"/>
    <circle cx="442" cy="298" r="1.4" opacity="0.6"/><circle cx="540" cy="330" r="1" opacity="0.5"/>
    <circle cx="598" cy="268" r="1.5" opacity="0.65"/>
  </g>

  <!-- taşların arka ışığı -->
  <g opacity="0.55" filter="url(#soft)">
    <circle cx="126" cy="252" r="26" fill="#ff4d6d"/>
    <circle cx="218" cy="252" r="26" fill="#ffb020"/>
    <circle cx="310" cy="252" r="26" fill="#2ee6a8"/>
    <circle cx="402" cy="252" r="26" fill="#4d9dff"/>
    <circle cx="494" cy="252" r="26" fill="#b46bff"/>
    <circle cx="586" cy="252" r="26" fill="#eaf6ff"/>
  </g>

  <!-- taşlar -->
  <g transform="translate(126,252)">
    <polygon points="0,-26 24,0 0,26 -24,0" fill="#ff4d6d" stroke="#ffb3c1" stroke-width="2"/>
    <polygon points="0,-13 12,0 0,13 -12,0" fill="#ffb3c1" opacity="0.55"/>
  </g>
  <g transform="translate(218,252)">
    <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="#ffb020" stroke="#ffe3a3" stroke-width="2"/>
    <polygon points="-10,-10 6,-14 10,4 -6,8" fill="#ffe3a3" opacity="0.5"/>
  </g>
  <g transform="translate(310,252)">
    <polygon points="0,-28 8,-9 27,-9 12,3 18,22 0,11 -18,22 -12,3 -27,-9 -8,-9" fill="#2ee6a8" stroke="#a9ffe4" stroke-width="2"/>
    <circle cx="-5" cy="-7" r="4" fill="#a9ffe4" opacity="0.6"/>
  </g>
  <g transform="translate(402,252)">
    <rect x="-22" y="-22" width="44" height="44" rx="9" fill="#4d9dff" stroke="#bcd8ff" stroke-width="2"/>
    <rect x="-14" y="-14" width="20" height="14" rx="5" fill="#bcd8ff" opacity="0.5"/>
  </g>
  <g transform="translate(494,252)">
    <polygon points="0,-26 25,19 -25,19" fill="#b46bff" stroke="#e0c4ff" stroke-width="2"/>
    <polygon points="0,-12 12,11 -12,11" fill="#e0c4ff" opacity="0.45"/>
  </g>
  <g transform="translate(586,252)">
    <circle cx="0" cy="0" r="25" fill="#eaf6ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-8" cy="-9" r="7" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- başlık -->
  <text x="320" y="128" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, sans-serif"
        font-size="62" font-weight="bold" letter-spacing="6" fill="#3ee0ff" opacity="0.35" filter="url(#tiny)">GEM MATCH</text>
  <text x="320" y="126" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, sans-serif"
        font-size="62" font-weight="bold" letter-spacing="6" fill="url(#gold)">GEM MATCH</text>
  <text x="320" y="166" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, sans-serif"
        font-size="17" font-weight="bold" letter-spacing="5" fill="#8fa3c8">MATCH · BLAST · RISE</text>

  <!-- alt çizgi -->
  <rect x="252" y="308" width="136" height="3" rx="1.5" fill="#3ee0ff" opacity="0.7"/>
</svg>
